{% load static %}

<html>
    <head>
        <title>The List</title>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700|Material+Icons">
        <link rel="stylesheet" href="{% static '/bootstrap/css/bootstrap.min.css' %}">
        <link rel="stylesheet" href="{% static '/bootstrap/css/custom.css' %}">
        <script src="{% static '/bootstrap/js/bootstrap.bundle.min.js' %}"></script>
    </head>
    <body>
        <nav class="navbar navbar-dark bg-custom mb-3 sticky-top" style="background-color: #590404;">
            <div class="container-fluid">
                <a class="navbar-brand mb-0" href="{% url 'view_menu' %}">My Tapas Menu</a>
                <a href="" style="color:white"><i class="material-icons">add</i></a>
            </div>
        </nav>

        <div class="container-fluid">
            <div class="row">
                <nav id="sidebar" class="col-md-3 col-lg-2 d-md-block bg-light sidebar">
                    <div class="position-sticky">
                        <ul class="nav flex-column">
                            {% block sidebar %}
                                <li class="nav-item">
                                    <a class="nav-link active" href="{% url 'add_menu' %}">
                                        Add Menu
                                    </a>
                                </li>
                                <li class="nav-item">
                                    <a class="nav-link" href="{% url 'view_basic_list' %}">
                                        View Menu
                                    </a>
                                </li>
                            {% endblock %}
                        </ul>
                    </div>
                </nav>

                <main class="col-md-9 ms-sm-auto col-lg-10 px-4">
                    {% block content %}
                    {% endblock %}
                </main>
            </div>
        </div>  

        <footer class="footer bg-custom" style="background-color: #590404;">
            <div class="container">&copy; 2020</div>
        </footer>

    </body>
</html>
