{% extends 'tapasapp/base.html' %} {% load static %} {% block sidebar %}
<li class="nav-item">
  <a class="nav-link active" href="{% url 'view_menu' %}"> Back to main </a>
</li>
{% endblock %} {% block content %}
<div class="container-fluid">
  <div class="row">
    <div class="col-12">
      <div class="card border-0">
        <div class="card-body bg-light">
          <h5 class="mb-3">Type in Dish Details:</h5>

          <form method="POST">
            {% csrf_token %}

            <div class="mb-3">
              <label for="dish_name" class="form-label">Name:</label>
              <input
                type="text"
                class="form-control"
                id="dish_name"
                name="dish_name"
                required
              />
            </div>

            <div class="row mb-4">
              <div class="col-md-6 mb-3 mb-md-0">
                <label for="cooking_time" class="form-label">Cook Time:</label>
                <input
                  type="number"
                  min="0"
                  class="form-control"
                  id="cooking_time"
                  name="cooking_time"
                  required
                  onkeydown="return event.keyCode !== 189"
                  oninput="this.value = this.value.replace('-', '')"
                />
              </div>
              <div class="col-md-6">
                <label for="prep_time" class="form-label">Prep Time:</label>
                <input
                  type="number"
                  min="0"
                  class="form-control"
                  id="prep_time"
                  name="prep_time"
                  required
                  onkeydown="return event.keyCode !== 189"
                  oninput="this.value = this.value.replace('-', '')"
                />
              </div>
            </div>

            <div>
              <button type="submit" class="btn btn-secondary">
                Add to menu
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  // Function to ensure only positive numbers are entered
  document.addEventListener("DOMContentLoaded", function () {
    const numberInputs = document.querySelectorAll('input[type="number"]');

    numberInputs.forEach((input) => {
      // Set minimum value
      input.setAttribute("min", "0");

      // Prevent negative values on input
      input.addEventListener("input", function (e) {
        if (this.value < 0 || this.value === "-") {
          this.value = 0;
        }
      });

      // Prevent paste of negative values
      input.addEventListener("paste", function (e) {
        let pasteData = e.clipboardData.getData("text");
        if (parseFloat(pasteData) < 0 || pasteData.includes("-")) {
          e.preventDefault();
        }
      });

      // Prevent the minus key
      input.addEventListener("keydown", function (e) {
        if (e.key === "-" || e.keyCode === 189) {
          e.preventDefault();
        }
      });
    });
  });
</script>
{% endblock %}
