{% load static %}

<html>
  <head>
    <title>The List</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700|Material+Icons"
    />
    <link
      rel="stylesheet"
      href="{% static '/bootstrap/css/bootstrap.min.css' %}"
    />
    <link rel="stylesheet" href="{% static '/bootstrap/css/custom.css' %}" />
    <script src="{% static '/bootstrap/js/bootstrap.bundle.min.js' %}"></script>
    <style>
      html,
      body {
        height: 100%;
      }
      body {
        display: flex;
        flex-direction: column;
      }
      .content-wrapper {
        flex: 1;
        display: flex;
        flex-direction: column;
      }
      .container-fluid {
        flex: 1;
      }
      .row {
        flex: 1;
      }
      .bg-custom {
        background-color: #590404 !important;
      }
      .sidebar {
        position: sticky;
        top: 56px;
        height: calc(100vh - 112px); /* Navbar and footer height */
        overflow-y: auto;
      }
      .footer {
        padding: 1rem 0;
        color: white;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-dark bg-custom mb-3 sticky-top">
      <div class="container-fluid">
        <a class="navbar-brand mb-0" href="{% url 'view_menu' %}"
          >My Tapas Menu</a
        >
        <a href="" class="text-white"><i class="material-icons">add</i></a>
      </div>
    </nav>

    <div class="content-wrapper">
      <div class="container-fluid">
        <div class="row">
          <nav
            id="sidebar"
            class="col-md-3 col-lg-2 d-md-block bg-light sidebar"
          >
            <div class="position-sticky">
              <ul class="nav flex-column">
                {% block sidebar %}
                <li class="nav-item">
                  <a class="nav-link active" href="{% url 'add_menu' %}">
                    Add Menu
                  </a>
                </li>
                <li class="nav-item">
                  <a class="nav-link" href="{% url 'view_basic_list' %}">
                    View Menu
                  </a>
                </li>
                {% endblock %}
              </ul>
            </div>
          </nav>

          <main class="col-md-9 ms-sm-auto col-lg-10 px-4">
            {% block content %} {% endblock %}
          </main>
        </div>
      </div>
    </div>

    <footer class="footer bg-custom">
      <div class="container">&copy; 2020</div>
    </footer>
  </body>
</html>
